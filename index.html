<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PlayDotStudy</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Comic Neue', 'Comic Sans MS', cursive;
    background-color: #ffeef8;
    background-image: radial-gradient(#ffffff 10%, transparent 11%);
    background-size: 40px 40px;
    color: #333;
    margin: 20px;
}

#wrapper {
    max-width: 700px;
    margin: 0 auto;
}

section {
    background: #fff;
    padding: 20px;
    margin-bottom: 40px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

button {
    background: #ffc9f0;
    border: 2px solid #ffb3e6;
    padding: 10px 15px;
    border-radius: 15px;
    font-family: 'Comic Neue', 'Comic Sans MS', cursive;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #ffb3e6;
}

#music-player {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    height: 450px; /* must stay this height */
    background: #ffe6f7;
    border: 3px solid #ffb3e6;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    padding: 10px;
    cursor: grab;
    z-index: 9999;
}

header {
    background: #fff;
    border-radius: 25px;
    padding: 25px;
    border: 4px solid #ffb3e6;
}

iframe {
    display: block;
    margin: 0 auto;
}

#game {
    background: #fff;
    border: 4px solid #ffb3e6;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(255, 182, 216, 0.4);
    text-align: center;
}

/* Progress bar */
#progress-container {
    width: 100%;
    height: 25px;
    background: #ffd6ec;
    border-radius: 15px;
    overflow: hidden;
    margin: 15px 0;
    border: 2px solid #ffb3e6;
}

#progress-bar {
    height: 100%;
    width: 0%;
    background: #ff8fd6;
    transition: width 0.3s;
}
.decor {
    display: block;
    margin: 10px auto;
    width: 120px;
}

</style>
</head>

<body>
<div id="wrapper">
<img src="https://i.postimg.cc/5yKK2G7Y/red.gif" class="decor">


    <!-- Header -->
    <header>
        <h1>PlayDotStudy ＞︿＜</h1>
        <p>play and learn! ❤️</p>
    </header>

    <!-- Timer Section -->
    <section id="timer-section">
        <h2>Timer</h2>

        <!-- Progress bar goes HERE -->
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>

        <button onclick="startTimer()">Start</button>
        <button onclick="stopTimer()">Stop</button>
        <button onclick="resetTimer()">Reset</button>

        <br><br>

        <button onclick="setTimer(5)">5 minutes</button>
        <button onclick="setTimer(10)">10 minutes</button>
        <button onclick="setTimer(15)">15 minutes</button>
    </section>

    <!-- Game Section -->
    <section id="game">
        <iframe 
            src="https://scratch.mit.edu/projects/1181830300/embed"
            allowtransparency="true"
            width="485"
            height="402"
            frameborder="0"
            scrolling="no"
            allowfullscreen>
        </iframe>
    </section>

    <!-- Music Section -->
    <section id="music">
        <div id="music-player">
            <iframe 
                width="100%" 
                height="450" 
                scrolling="no" 
                frameborder="no" 
                allow="autoplay; encrypted-media"
                src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2317089609&color=%23000000&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
            </iframe>
        </div>
    </section>

</div>

<!-- Progress Bar Script -->
<script>
let totalSeconds = 0;
let secondsLeft = 0;
let timerInterval;

function setTimer(minutes) {
    totalSeconds = minutes * 60;
    secondsLeft = totalSeconds;
    updateProgress();
}

function updateProgress() {
    const percent = ((totalSeconds - secondsLeft) / totalSeconds) * 100;
    document.getElementById("progress-bar").style.width = percent + "%";
}

function updateTimer() {
    secondsLeft--;
    updateProgress();

    if (secondsLeft <= 0) {
        clearInterval(timerInterval);
    }
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
}

function resetTimer() {
    clearInterval(timerInterval);
    secondsLeft = totalSeconds;
    updateProgress();
}
</script>

<!-- Music Player Drag Script -->
<script>
const player = document.getElementById("music-player");
let offsetX = 0, offsetY = 0, isDragging = false;

player.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.clientX - player.offsetLeft;
    offsetY = e.clientY - player.offsetTop;
    player.style.cursor = "grabbing";
});

document.addEventListener("mousemove", (e) => {
    if (isDragging) {
        player.style.left = (e.clientX - offsetX) + "px";
        player.style.top = (e.clientY - offsetY) + "px";
    }
});

document.addEventListener("mouseup", () => {
    isDragging = false;
    player.style.cursor = "grab";
});
</script>

</body>
</html>
