<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PlayDotStudy Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Comic Neue', 'Comic Sans MS', cursive;
        background-color: #fdf6ff;
        color: #333;
        margin: 20px;
    }

    section {
        background: #fff;
        padding: 20px;
        margin-bottom: 40px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button {
        background: #ffb3e6;
        border: none;
        padding: 10px 15px;
        margin: 5px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #ff8fd6;
    }

    #timer-display {
        font-size: 40px;
        font-weight: bold;
        color: #ff4fa3;
    }
</style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>PlayDotStudy Prototype</h1>
        <p>A simple learning + gaming experiment</p>
    </header>

    <!-- Timer Section -->
   <section id="timer-section">
    <h2>Timer</h2>

    <p id="timer-display">00:00</p>

    <button onclick="startTimer()">Start</button>
    <button onclick="stopTimer()">Stop</button>
    <button onclick="resetTimer()">Reset</button>

    <br><br>

    <button onclick="setTimer(5)">5 minutes</button>
    <button onclick="setTimer(10)">10 minutes</button>
    <button onclick="setTimer(15)">15 minutes</button>
</section>

    <!-- Game Section -->
    <section id="game">
        <h2>Game</h2>
        <iframe 
            src="YOUR_SCRATCH_EMBED_URL"
            allowfullscreen
            width="485"
            height="402">
        </iframe>
    </section>

    <!-- Music Section -->
<section id="music">
    <h2>Music</h2>

    <iframe 
        width="100%" 
        height="450" 
        scrolling="no" 
        frameborder="no" 
        allow="autoplay; encrypted-media"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2317089609&color=%23000000&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
    </iframe>
</section>

    <!-- Timer Script -->
  <script>
let seconds = 0;
let timerInterval;

function formatTime(totalSeconds) {
    let mins = Math.floor(totalSeconds / 60);
    let secs = totalSeconds % 60;

    if (secs < 10) secs = "0" + secs;
    return mins + ":" + secs;
}

function updateTimer() {
    seconds--;
    document.getElementById("timer-display").textContent = formatTime(seconds);

    if (seconds <= 0) {
        clearInterval(timerInterval);
    }
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
}

function resetTimer() {
    clearInterval(timerInterval);
    seconds = 0;
    document.getElementById("timer-display").textContent = "00:00";
}

function setTimer(minutes) {
    seconds = minutes * 60;
    document.getElementById("timer-display").textContent = formatTime(seconds);
}
</script>

       
    
</body>
</html>
