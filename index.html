<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PlayDotStudy</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Comic Neue', 'Comic Sans MS', cursive;
    background-color: #ffeef8;
    background-image: radial-gradient(#ffffff 10%, transparent 11%);
    background-size: 40px 40px;
    color: #333;
    margin: 20px;
}

#wrapper {
    max-width: 700px;
    margin: 0 auto;
}

section {
    background: #fff;
    padding: 20px;
    margin-bottom: 40px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

button {
    background: #ffc9f0;
    border: 2px solid #faa5ca;
    padding: 10px 15px;
    border-radius: 15px;
    font-family: 'Comic Neue', 'Comic Sans MS', cursive;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #ffb3e6;
}

#music-player {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    height: 450px; /* must stay this height */
    background: #ffe6f7;
    border: 3px solid #ffb3e6;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    padding: 10px;
    cursor: grab;
    z-index: 9999;
}

header {
    background: #fff;
    border-radius: 25px;
    padding: 25px;
    border: 4px solid #ffb3e6;
    text-align: center;
}

iframe {
    display: block;
    margin: 0 auto;
}

#game {
    background: #fff;
    border: 4px solid #ffb3e6;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(255, 182, 216, 0.4);
    text-align: center;
}

/* Progress bar */
#progress-container {
    width: 100%;
    height: 40px;
    background: #ffd6ec;
    border-radius: 50px;
    overflow: hidden;
    margin: 15px 0;
    border: 2px solid #f75299;
}

#progress-bar {
    height: 100%;
    width: 50%;
    background: #ff8fd6;
    transition: width 0.3s;
}
.decor {
    display: block;
    margin: 10px auto;
    width: 520px;
}

#buddy-img {
    width: 160px;
    cursor: pointer;
    transition: transform 0.1s;
}

#buddy-img:hover {
    transform: scale(1.05);
}

#buddy-img:active {
    transform: scale(0.95);
}
.top-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: stretch;
}

.top-row > * {
    flex: 1;
}
#timer-section {
    margin-bottom: 0;
}

.top-row header,
.top-row #timer-section {
    width: 50%;
}
.game-layout {
    display: flex;
    gap: 25px;
    align-items: center;
    justify-content: space-between;
}
#buddy {
    width: 180px;
    text-align: center;
}

#timer-section {
    text-align: center;
}
#game {
    background: #fff;
    border: 4px solid #ffb3e6;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 2px 6px rgba(255, 182, 216, 0.4);
    text-align: center;

    position: relative;
}
.corner-decor {
    position: absolute;

    bottom: -30px;
    right: -30px;

    width: 120px;

    z-index: 10;
}
</style>
</head>

<body>
<div id="wrapper">

    <div class="top-row">
    

    <header>
        <h1>PlayDotStudy ^_^</h1>
        <p>play and learn! ❤️</p>
    </header>

    <section id="timer-section">
        <h2>pomodoro timer 🍰</h2>

        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>

        <button onclick="startTimer()">▶ Start</button>
        <button onclick="stopTimer()">⏸ Pause</button>
        <button onclick="resetTimer()">↺ Reset</button>

        <br><br>

        <button onclick="setTimer(5)">5 m</button>
        <button onclick="setTimer(10)">10 m</button>
        <button onclick="setTimer(15)">15 m</button>
    </section>

</div>

    <!-- Game Section -->
    <section id="game">
 

    <img
        class="corner-decor"
        src="https://i.postimg.cc/m2BYLpfF/pink_4.png"
        alt="decoration">

    <div class="game-layout">

        <iframe
            src="https://scratch.mit.edu/projects/1181830300/embed"
            allowtransparency="true"
            width="430"
            height="402"
            frameborder="0"
            scrolling="no"
            allowfullscreen>
        </iframe>

        <div id="buddy">

            <h2>pompompurin! ⭐</h2>

            <img
                id="buddy-img"
                src="https://i.postimg.cc/8C7X63R8/yellow_6.png"
                alt="Study Buddy"
                onclick="petBuddy()">

            <p>
                clicks:
                <span id="points">0</span>
            </p>

        </div>

    </div>
        <p id="buddy-message">
click me! ⭐
</p>

</section>

    <!-- Music Section -->
        <div id="music-player">
            <iframe 
                width="100%" 
                height="450" 
                scrolling="no" 
                frameborder="no" 
                allow="autoplay; encrypted-media"
                src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2317089609&color=%23000000&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
            </iframe>
        </div>
<script>
let points = 0;

function petBuddy() {
    points++;

    document.getElementById("points").textContent = points;

    let message = "0 points wow ⭐";

    if (points >= 10) {
        message = "hi friend! 🌸";
    }

    if (points >= 25) {
        message = "you're studying so hard! 🍓";
    }

    if (points >= 50) {
        message = "great job today! ⭐";
    }

    if (points >= 75) {
        message = "wow!! 100 clicks!! 💖";
    }

    if (points >= 100) {
        message = "pompompurin is proud of you! 🧸";
    }

    if (points >= 110) {
        message = "why not play the game? 🪽"
    }

    if (points >= 120) {
        message = "wow!!!! keep clicking!" 
    }
    
    if (points >= 200) {
        message = "wow!! you're persistent
    }

    if (points >= 300)
        message = "300! that's so many 🤩"

    document.getElementById("buddy-message").textContent = message;
}

</script>

<!-- Progress Bar Script -->
<script>
let totalSeconds = 0;
let secondsLeft = 0;
let timerInterval;

function setTimer(minutes) {
    totalSeconds = minutes * 60;
    secondsLeft = totalSeconds;
    updateProgress();
}

function updateProgress() {
    const percent = ((totalSeconds - secondsLeft) / totalSeconds) * 100;
    document.getElementById("progress-bar").style.width = percent + "%";
}

function updateTimer() {
    secondsLeft--;
    updateProgress();

    if (secondsLeft <= 0) {
        clearInterval(timerInterval);
    }
}

function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
}

function resetTimer() {
    clearInterval(timerInterval);
    secondsLeft = totalSeconds;
    updateProgress();
}
</script>

<!-- Music Player Drag Script -->
<script>
const player = document.getElementById("music-player");
let offsetX = 0, offsetY = 0, isDragging = false;

player.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.clientX - player.offsetLeft;
    offsetY = e.clientY - player.offsetTop;
    player.style.cursor = "grabbing";
});

document.addEventListener("mousemove", (e) => {
    if (isDragging) {
        player.style.left = (e.clientX - offsetX) + "px";
        player.style.top = (e.clientY - offsetY) + "px";
    }
});

document.addEventListener("mouseup", () => {
    isDragging = false;
    player.style.cursor = "grab";
});
const tips = [
    "Take a break when your timer ends! ❤️",
    "Drink water while studying!",
    "Why not co-study with someone?",
    "Take some notes on a topic you find hard!",
    "Don't get distracted!",
    "If you're bored, try clicking pompompurin!",
    "Maybe I'll turn this site into somethnig fun..",
    "Javascript is hard 😭",
    "Maybe walk around!",
];

function newTip() {
    const random =
        Math.floor(Math.random() * tips.length);

    document.getElementById("tip-box").textContent =
        tips[random];
}
</script>
<section id="tips">
    <h2>study tips 🍓</h2>

    <button onclick="newTip()">
        show tip!
    </button>

    <p id="tip-box">
        click the button!
    </p>
</section>

</body>
</html>
