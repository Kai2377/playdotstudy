<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PlayDotStudy Prototype</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>PlayDotStudy Prototype</h1>
        <p>A simple learning + gaming experiment</p>
    </header>

    <!-- Timer Section -->
    <section id="timer">
        <h2>Timer</h2>
        <p id="timer-display">00:00</p>
        <button onclick="startTimer()">Start</button>
        <button onclick="stopTimer()">Stop</button>
        <button onclick="resetTimer()">Reset</button>
    </section>

    <!-- Game Section -->
    <section id="game">
        <h2>Game</h2>
        <iframe 
            src="YOUR_SCRATCH_EMBED_URL"
            allowfullscreen
            width="485"
            height="402">
        </iframe>
    </section>

    <!-- Music Section -->
    <section id="music">
        <h2>Music</h2>
        <iframe 
            width="100%" 
            height="166" 
            scrolling="no" 
            frameborder="no"
            src="YOUR_SOUNDCLOUD_EMBED_URL">
        </iframe>
    </section>

    <!-- Timer Script -->
    <script>
        let seconds = 0;
        let timerInterval;

        function updateTimer() {
            seconds++;
            document.getElementById("timer-display").textContent = seconds;
        }

        function startTimer() {
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function resetTimer() {
            stopTimer();
            seconds = 0;
            document.getElementById("timer-display").textContent = "00:00";
        }
    </script>
.p1 {
  font-family: "Times New Roman", Times, serif;
}

.p2 {
  font-family: Arial, Helvetica, sans-serif;
}

.p3 {
  font-family: "Lucida Console", "Courier New", monospace;
}
</style>
</head>
<body>

</body>
</html>
